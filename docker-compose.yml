services:
  fin-financiamento:
    build: .
    image: fin-financiamento:1.0
    container_name: fin-financiamento
    networks:
      - default
      - rede-proxy
    ports:
      - "8502:8502"
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8501/_stcore/health\")'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  rede-proxy:
    external: true