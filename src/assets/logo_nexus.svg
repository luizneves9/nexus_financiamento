<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 48" width="176" height="48">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#C026D3"/>
    </linearGradient>
    <linearGradient id="anel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="texto" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#9333EA"/>
    </linearGradient>
    <filter id="brilho" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- selo: círculo escuro com anel neon -->
  <circle cx="24" cy="24" r="22" fill="#0B1533"/>
  <circle cx="24" cy="24" r="21" fill="none" stroke="url(#anel)" stroke-width="2" filter="url(#brilho)"/>

  <!-- letra N em gradiente -->
  <path d="M16.5 33.5 V14.5 L31.5 33.5 V14.5" fill="none" stroke="url(#neon)" stroke-width="7"
        stroke-linejoin="round" stroke-linecap="round" filter="url(#brilho)"/>

  <!-- nome -->
  <text x="56" y="19" fill="#8B93A7" font-family="'Segoe UI', 'Source Sans Pro', Arial, sans-serif"
        font-size="9.5" font-weight="600" letter-spacing="4.2">SISTEMA</text>
  <text x="54.5" y="41" fill="url(#texto)" font-family="'Segoe UI', 'Source Sans Pro', Arial, sans-serif"
        font-size="25" font-weight="800" letter-spacing="2">NEXUS</text>
</svg>
