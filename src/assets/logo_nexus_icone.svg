<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#C026D3"/>
    </linearGradient>
    <linearGradient id="anel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="brilho" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- selo: círculo escuro com anel neon (mesmo desenho de logo_nexus.svg) -->
  <circle cx="24" cy="24" r="22" fill="#0B1533"/>
  <circle cx="24" cy="24" r="21" fill="none" stroke="url(#anel)" stroke-width="2" filter="url(#brilho)"/>

  <!-- letra N em gradiente -->
  <path d="M16.5 33.5 V14.5 L31.5 33.5 V14.5" fill="none" stroke="url(#neon)" stroke-width="7"
        stroke-linejoin="round" stroke-linecap="round" filter="url(#brilho)"/>
</svg>
